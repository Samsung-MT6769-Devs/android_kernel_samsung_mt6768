name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device'
        required: true
        default: 'a32'
        type: choice
        options:
          - a32
          - a22
          - f22
          - m22
          - m32

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzops pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libtext-serif-perl
          sudo ln -s /usr/lib/x86_64-linux-gnu/libxml2.so.2 /usr/lib/x86_64-linux-gnu/libxml2.so.16 2>/dev/null || true

      - name: Download Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/zyc-clang
          cd $GITHUB_WORKSPACE/zyc-clang
          wget https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20250704-release/Clang-14.0.6-20250704-release.tar.gz
          tar -xf Clang-14.0.6-20250704-release.tar.gz
          rm Clang-14.0.6-20250704-release.tar.gz

      - name: Build Kernel
        env:
          DEVICE: ${{ github.event.inputs.device }}
          TC: ${{ github.workspace }}/zyc-clang
          ARCH: arm64
          KCFLAGS: ' -w -pipe -O3'
          KCPPFLAGS: ' -O3'
          CONFIG_SECTION_MISMATCH_WARN_ONLY: y
        run: |
          export CROSS_COMPILE=$TC/bin/aarch64-linux-gnu-
          export LD=$TC/bin/ld.lld
          export OBJCOPY=$TC/bin/llvm-objcopy
          export AS=$TC/bin/llvm-as
          export NM=$TC/bin/llvm-nm
          export STRIP=$TC/bin/llvm-strip
          export OBJDUMP=$TC/bin/llvm-objdump
          export READELF=$TC/bin/llvm-readelf
          export CC=$TC/bin/clang
          
          CFGDIR=arch/arm64/configs
          rm -rf $CFGDIR/compiled_defconfig
          
          make -C $(pwd) O=$(pwd)/out clean -j$(nproc)
          make -C $(pwd) O=$(pwd)/out mrproper -j$(nproc)
          
          cat $CFGDIR/mt6768_slm_defconfig $CFGDIR/$DEVICE.config $CFGDIR/battery.config > $CFGDIR/compiled_defconfig
          
          echo '
          CONFIG_ALWAYS_PERMISSIVE=y
          CONFIG_MTK_GPU_VERSION="mali valhall r32p1"
          ' >> "$CFGDIR/compiled_defconfig"
          
          make -C $(pwd) O=$(pwd)/out -j$(nproc) compiled_defconfig
          make -s -C $(pwd) O=$(pwd)/out -j$(nproc)

      - name: Verify and Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ github.event.inputs.device }}
          path: out/arch/arm64/boot/Image
          
