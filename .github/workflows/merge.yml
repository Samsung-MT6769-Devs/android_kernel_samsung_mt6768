name: Upstream Merge
on:
  workflow_dispatch: # Позволяет запускать кнопку "Run workflow" вручную

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "AutoMergeBot"
          git config user.email "bot@bot.com"
          git remote add stable git://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git
          git fetch stable

      - name: Attempt Merge
        run: |
          # Пытаемся мерджить. Если конфликт - скрипт упадет тут
          git merge v4.14.364 -m "Auto-merge 4.14.364"
          
          # Если мердж прошел успешно - пушим
          git push origin HEAD:main
